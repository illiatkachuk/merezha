[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "merezha"
version = "0.1.0"
description = "AI-native network observability: async probes, hybrid ML anomaly detection, and an MCP server that lets AI assistants diagnose your network."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Illia Tkachuk" }]
keywords = [
  "network",
  "monitoring",
  "observability",
  "latency",
  "anomaly-detection",
  "isolation-forest",
  "mcp",
  "model-context-protocol",
  "ai",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking :: Monitoring",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/illiatkachuk/merezha"
Issues = "https://github.com/illiatkachuk/merezha/issues"

[project.scripts]
merezha = "merezha.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/merezha"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
